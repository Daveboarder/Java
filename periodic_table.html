<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Periodic Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .periodic-table-container {
            position: relative;
            margin-bottom: 20px;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 3px;
        }

        .element {
            aspect-ratio: 1;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5px;
            font-size: 0.7em;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .element:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .element:active {
            transform: scale(0.95);
        }

        .atomic-number {
            font-size: 0.7em;
            font-weight: bold;
            position: absolute;
            top: 2px;
            left: 3px;
        }

        .symbol {
            font-size: 1.4em;
            font-weight: bold;
            margin: 5px 0;
        }

        .name {
            font-size: 0.6em;
            text-align: center;
        }

        .atomic-mass {
            font-size: 0.55em;
            margin-top: 2px;
        }

        /* Element categories colors */
        .alkali-metal { background-color: #ff6b6b; color: white; }
        .alkaline-earth { background-color: #feca57; color: #333; }
        .transition-metal { background-color: #48dbfb; color: #333; }
        .post-transition { background-color: #a29bfe; color: white; }
        .metalloid { background-color: #00d2d3; color: white; }
        .nonmetal { background-color: #1dd1a1; color: white; }
        .halogen { background-color: #10ac84; color: white; }
        .noble-gas { background-color: #5f27cd; color: white; }
        .lanthanide { background-color: #ff9ff3; color: #333; }
        .actinide { background-color: #ff6348; color: white; }
        .unknown { background-color: #c8d6e5; color: #333; }

        .empty {
            background: none;
            border: none;
            box-shadow: none;
            cursor: default;
            pointer-events: none;
        }

        .legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .info-box {
            position: absolute;
            top: 0;
            left: 28%;
            width: 20%;
            height: auto;
            min-height: 150px;
            background: linear-gradient(135deg, #e7e9f3 0%, #373738 100%);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .info-box h2 {
            color: inherit;
            margin-bottom: 7px;
            font-size: 0.9em;
        }

        .info-box p {
            color: inherit;
            line-height: 1;
            margin: 5px 0;
            font-size: 0.9em;
        }

        .info-box .element-symbol {
            font-size: 1.4em;
            font-weight: bold;
            margin: 8px 0;
            color: inherit;
        }

        @media (max-width: 1200px) {
            .element {
                font-size: 0.5em;
            }
        }
    </style>
</head>

        // Calculate grid positions and create elements
        function createPeriodicTable() {
            const table = document.getElementById('periodicTable');
            const maxRow = 10;
            const maxCol = 18;
            
            // Create a 2D array to track positions
            const grid = Array(maxRow * maxCol).fill(null);
            
            // Place elements in grid
            elements.forEach(el => {
                const gridIndex = (el.row - 1) * maxCol + (el.col - 1);
                grid[gridIndex] = el;
            });
            
            // Create buttons for all positions
            grid.forEach((el, index) => {
                const button = document.createElement('button');
                
                if (el) {
                    button.className = `element ${el.category}`;
                    button.innerHTML = `
                        <span class="atomic-number">${el.num}</span>
                        <div class="symbol">${el.symbol}</div>
                        <div class="name">${el.name}</div>
                        <div class="atomic-mass">${el.mass}</div>
                    `;
                    button.onmouseover = () => showElementInfo(el);
                } else {
                    button.className = 'element empty';
                }
                
                table.appendChild(button);
            });
        }

        // Show element information
        function showElementInfo(element) {
            const infoBox = document.getElementById('infoBox');
            const colors = categoryColors[element.category] || { bg: '#667eea', text: 'white' };
            
            // Update background and text colors
            infoBox.style.background = colors.bg;
            infoBox.style.color = colors.text;
            
            // Format spectral lines
            const spectralLinesText = element.spectralLines 
                ? element.spectralLines.map(line => `${line} nm`).join(', ')
                : 'N/A';
            
            infoBox.innerHTML = `
                <div class="element-symbol">${element.symbol}</div>
                <h2>${element.name}</h2>
                <p><strong>Atomic Number:</strong> ${element.num}</p>
                <p><strong>Atomic Mass:</strong> ${element.mass}</p>
                <p><strong>Category:</strong> ${element.category.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase())}</p>
                <p><strong>Spectral Lines:</strong> ${spectralLinesText}</p>
            `;
        }

        // Initialize table on page load
        createPeriodicTable();
    </script>
