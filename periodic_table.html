<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Periodic Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #aff7c1 0%, #fcfcfc 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .periodic-table-container {
            position: relative;
            margin-bottom: 20px;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 3px;
        }

        .element {
            aspect-ratio: 1;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5px;
            font-size: 0.7em;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .element:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .element:active {
            transform: scale(0.95);
        }

        .atomic-number {
            font-size: 0.7em;
            font-weight: bold;
            position: absolute;
            top: 2px;
            left: 3px;
        }

        .symbol {
            font-size: 1.4em;
            font-weight: bold;
            margin: 5px 0;
        }

        .name {
            font-size: 0.6em;
            text-align: center;
        }

        .atomic-mass {
            font-size: 0.55em;
            margin-top: 2px;
        }

        /* Element categories colors */
        .alkali-metal { background-color: #b0e485; color: rgb(44, 41, 41); }
        .alkaline-earth { background-color: #20b960; color: #333; }
        .transition-metal { background-color: #268b4d; color: #333; }
        .post-transition { background-color: #70f182; color: #333; }
        .metalloid { background-color: #00d2d3; color: white; }
        .nonmetal { background-color: #43c487; color: white; }
        .halogen { background-color: #10ac84; color: white; }
        .noble-gas { background-color: #086951; color: white; }
        .lanthanide { background-color: #64c9b8; color: #333; }
        .actinide { background-color: #3c8592; color: white; }
        .unknown { background-color: #c8d6e5; color: #333; }

        .empty {
            background: none;
            border: none;
            box-shadow: none;
            cursor: default;
            pointer-events: none;
        }

        .legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .info-box {
            position: absolute;
            top: 0;
            left: 28%;
            width: 20%;
            height: auto;
            min-height: 150px;
            background: linear-gradient(135deg, #e7e9f3 0%, #373738 100%);
            border-radius: 10px;
            padding: 20px;
            color: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            z-index: 10;
            pointer-events: none;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .info-box-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .info-box .element-symbol {
            font-size: 3em;
            font-weight: bold;
            color: inherit;
            line-height: 1;
        }

        .info-box .atomic-number-top {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-size: 0.8em;
            font-weight: bold;
            color: inherit;
            opacity: 0.8;
        }

        .info-box .atomic-mass-top {
            font-size: 0.7em;
            font-weight: normal;
            margin-top: 3px;
        }

        .info-box .element-name {
            color: inherit;
            font-size: 1.1em;
            font-weight: bold;
            margin: 10px 0 15px 0;
            text-align: left;
        }

        .info-box .spectral-lines {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: left;
        }

        .info-box .spectral-line {
            display: flex;
            justify-content: space-between;
            color: inherit;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .info-box .spectral-line-energy {
            opacity: 0.8;
            font-size: 0.85em;
        }

        @media (max-width: 1200px) {
            .element {
                font-size: 0.5em;
            }
        }
    </style>
</head>

        // Calculate grid positions and create elements
        function createPeriodicTable() {
            const table = document.getElementById('periodicTable');
            const maxRow = 10;
            const maxCol = 18;
            
            // Create a 2D array to track positions
            const grid = Array(maxRow * maxCol).fill(null);
            
            // Place elements in grid
            elements.forEach(el => {
                const gridIndex = (el.row - 1) * maxCol + (el.col - 1);
                grid[gridIndex] = el;
            });
            
            // Create buttons for all positions
            grid.forEach((el, index) => {
                const button = document.createElement('button');
                
                if (el) {
                    button.className = `element ${el.category}`;
                    button.innerHTML = `
                        <span class="atomic-number">${el.num}</span>
                        <div class="symbol">${el.symbol}</div>
                        <div class="name">${el.name}</div>
                        <div class="atomic-mass">${el.mass}</div>
                    `;
                    button.onmouseover = () => showElementInfo(el);
                } else {
                    button.className = 'element empty';
                }
                
                table.appendChild(button);
            });
        }

        // Show element information
        function showElementInfo(element) {
            const infoBox = document.getElementById('infoBox');
            const colors = categoryColors[element.category] || { bg: '#667eea', text: 'white' };
            
            // Update background and text colors
            infoBox.style.background = colors.bg;
            infoBox.style.color = colors.text;
            
            // Format spectral lines - each on a new line with energy on the right
            let spectralLinesHTML = '';
            if (element.spectralLines && element.spectralLines.length > 0) {
                spectralLinesHTML = element.spectralLines.map(line => {
                    const wavelength = typeof line === 'number' ? line : line.wavelength;
                    const energy = typeof line === 'number' ? null : line.upperLevelEnergy;
                    const energyText = energy ? `<span class="spectral-line-energy">${energy} eV</span>` : '';
                    return `<div class="spectral-line"><span>${wavelength} nm</span>${energyText}</div>`;
                }).join('');
            } else {
                spectralLinesHTML = '<div class="spectral-line">N/A</div>';
            }
            
            infoBox.innerHTML = `
                <div class="info-box-header">
                    <div class="element-symbol">${element.symbol}</div>
                    <div class="atomic-number-top">
                        <div>${element.num}</div>
                        <div class="atomic-mass-top">${element.mass}</div>
                    </div>
                </div>
                <div class="element-name">${element.name}</div>
                <div class="spectral-lines">
                    ${spectralLinesHTML}
                </div>
            `;
        }

        // Initialize table on page load
        createPeriodicTable();
    </script>
